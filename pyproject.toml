[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ssa"
version = "0.1.0"
description = "Sub-quadratic Selective Attention — a linearly-scaling, codebook-routed sparse attention mechanism."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "chenxingqiang" }]
dependencies = [
    "torch>=2.1",
]

[project.optional-dependencies]
# Test suite
test = ["pytest>=7.0"]
# Production sparse path (CUDA only) and Qwen integration
prod = ["triton>=2.0", "transformers>=4.40"]

[project.urls]
Homepage = "https://github.com/chenxingqiang/Subquadratic-Selective-Attention"

[tool.setuptools]
packages = ["ssa"]
